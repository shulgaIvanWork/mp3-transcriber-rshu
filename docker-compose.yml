services:
  api:
    build: .
    image: audio-transcriber
    container_name: transcriber
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data                 # SQLite + загруженные mp3 + тексты
      - whisper-models:/root/.cache      # кэш скачанной модели
    environment:
      - API_KEY=${API_KEY:-change-me}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-1}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_LANG=${WHISPER_LANG:-ru}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE=${WHISPER_COMPUTE:-int8}
      - DELETE_AUDIO_AFTER_DONE=${DELETE_AUDIO_AFTER_DONE:-false}
    deploy:
      resources:
        limits:
          memory: 8g

volumes:
  whisper-models:
